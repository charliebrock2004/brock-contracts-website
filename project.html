<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://brockcontracts.co.uk/projects">
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('p');
  var known = { garage: 1, sierras: 1, 'new-build-perthshire': 1 };
  if (slug && known[slug]) window.location.replace('/projects/' + encodeURIComponent(slug));
  else window.location.replace('/projects');
})();
</script>
<meta http-equiv="refresh" content="0;url=/projects">
</head>
<body>
<p>This project page has moved. <a href="/projects">View our work</a>.</p>
</body>
</html>
